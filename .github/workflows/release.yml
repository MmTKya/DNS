name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless cosign signing needs an OIDC token; the installer and the in-panel
  # updater verify against it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The panel is embedded in the binary, so it has to exist before Go
      # builds anything.
      - name: Build the panel
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: web

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Two pins, both deliberate.
      #
      # The action: cosign-installer only publishes moving major tags up to
      # v3, so @v4 does not resolve and the job dies before it builds.
      #
      # The tool: cosign 3 and 4 dropped --output-signature/--output-certificate
      # for the new bundle format. install.sh verifies a detached signature and
      # certificate, so signing with a version that cannot emit them produces a
      # release nothing can check. Moving both sides to bundles is worth doing;
      # doing it silently as part of a release fix is not.
      - uses: sigstore/cosign-installer@v3.10.1
        with:
          cosign-release: v2.6.5

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs checksums.txt with the key whose public half is compiled
          # into the binary. Without it a released node cannot verify its own
          # update, so the release is worth failing over.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
