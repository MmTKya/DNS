name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless cosign signing needs an OIDC token; the installer and the in-panel
  # updater verify against it.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The panel is embedded in the binary, so it has to exist before Go
      # builds anything.
      - name: Build the panel
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: web

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pinned to an exact release: cosign-installer only publishes moving
      # major tags up to v3, so @v4 does not resolve and the job dies before
      # it builds anything.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
